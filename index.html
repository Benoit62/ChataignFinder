<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ChâtaignFinder</title>
  <meta name="description" content="Carte des zones de châtaigniers autour de Grenoble : peuplements IGN, spots, parkings et randos recoupés depuis forums et blogs.">
  <meta name="theme-color" content="#7a3e1d">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map" aria-label="Carte"></div>

  <header class="brand">
    <span class="brand-logo" aria-hidden="true">🌰</span>
    <div>
      <h1>ChâtaignFinder</h1>
      <p id="season" class="season"></p>
    </div>
  </header>

  <nav class="fab-col" aria-label="Actions carte">
    <button class="fab" id="btn-locate" title="Me localiser" aria-label="Me localiser">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7" fill="none"/></svg>
    </button>
    <button class="fab" id="btn-layers" title="Fonds de carte" aria-label="Fonds de carte">
      <svg viewBox="0 0 24 24"><path d="M12 3 2 8.5 12 14l10-5.5L12 3Z"/><path d="m2 13 10 5.5L22 13" fill="none"/><path d="m2 17.5 10 5.5 10-5.5" fill="none"/></svg>
    </button>
    <button class="fab" id="btn-add" title="Ajouter mon spot" aria-label="Ajouter mon spot">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none"/></svg>
    </button>
    <button class="fab" id="btn-info" title="Conseils & sources" aria-label="Conseils et sources">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none"/><path d="M12 11v6M12 7.5v.5" fill="none"/></svg>
    </button>
  </nav>

  <div id="layers-panel" class="pop" hidden>
    <h3>Fond de carte</h3>
    <div id="base-list" class="radio-list"></div>
    <h3>Calques</h3>
    <div id="overlay-list" class="check-list"></div>
  </div>

  <div id="add-hint" class="toast" hidden>Touchez la carte pour placer votre spot · <button id="add-cancel">Annuler</button></div>

  <section id="sheet" class="sheet" aria-live="polite">
    <button class="sheet-grip" id="sheet-grip" aria-label="Agrandir / réduire le panneau"><span></span></button>
    <div id="sheet-body"></div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="js/app.js"></script>
</body>
</html>
